<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Traffic • Live Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060810;
      --surface: #0d1117;
      --card: #111620;
      --card2: #161c2a;
      --border: #1e2740;
      --border2: #2a3555;
      --text: #dce8ff;
      --muted: #5a6e99;
      --muted2: #8899bb;
      --green: #00f5a0;
      --green-dim: rgba(0,245,160,0.12);
      --yellow: #ffc93c;
      --yellow-dim: rgba(255,201,60,0.12);
      --red: #ff4d6d;
      --red-dim: rgba(255,77,109,0.12);
      --blue: #4d9fff;
      --blue-dim: rgba(77,159,255,0.12);
      --purple: #b06dff;
      --accent: #00f5a0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,245,160,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      padding: 24px 28px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00f5a0, #00b8d9);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(0,245,160,0.3);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    h1 span { color: var(--green); }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 7px 14px;
      font-size: 12px;
      font-family: 'Space Mono', monospace;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,245,160,0.5); }
      50%       { opacity: 0.7; box-shadow: 0 0 0 5px rgba(0,245,160,0); }
    }

    #ts { color: var(--muted2); font-size: 11px; }

    /* ─── Stat Cards ─── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.2s;
    }

    .stat-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-color, var(--green)), transparent);
    }

    .stat-card.blue   { --accent-color: var(--blue); }
    .stat-card.yellow { --accent-color: var(--yellow); }

    .stat-label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-val {
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    /* Smaller variant for the active-phase cell */
    .stat-val--phase {
      font-size: 28px;
      letter-spacing: -1px;
    }

    .stat-card .stat-icon {
      position: absolute;
      right: 18px;
      top: 18px;
      font-size: 28px;
      opacity: 0.12;
    }

    /* ─── Main Grid ─── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ─── Cards ─── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      transition: border-color 0.3s;
    }

    .card:hover { border-color: var(--border2); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 12px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-badge {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(0,245,160,0.2);
    }

    /* Alert-count badge (red tint, initially hidden) */
    .card-badge--alerts {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(255,77,109,0.2);
      display: none;
    }

    .card-badge--alerts.is-visible { display: inline-block; }

    /* ─── Signal Grid ─── */
    .signals-section { margin-bottom: 16px; }

    .signals-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 12px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .signals-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .signal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
      position: relative;
      overflow: hidden;
    }

    .signal-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.35s;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,245,160,0.1), transparent 70%);
    }

    .signal-card.active {
      border-color: rgba(0,245,160,0.5);
      box-shadow: 0 0 0 1px rgba(0,245,160,0.15), 0 8px 32px rgba(0,245,160,0.1);
    }

    .signal-card.active::after { opacity: 1; }

    .signal-dir {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    /* ─── Traffic Light ─── */
    .traffic-light {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: #06080f;
      padding: 14px 10px;
      border-radius: 24px;
      border: 2px solid #1a2035;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    .bulb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0d1020;
      border: 1px solid #1e2840;
      transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
    }

    .bulb.red-on    { background: var(--red);    box-shadow: 0 0 12px 4px rgba(255,77,109,0.6),  inset 0 1px 3px rgba(255,255,255,0.2); border-color: var(--red); }
    .bulb.yellow-on { background: var(--yellow); box-shadow: 0 0 12px 4px rgba(255,201,60,0.6),  inset 0 1px 3px rgba(255,255,255,0.2); border-color: var(--yellow); }
    .bulb.green-on  { background: var(--green);  box-shadow: 0 0 12px 4px rgba(0,245,160,0.6),   inset 0 1px 3px rgba(255,255,255,0.2); border-color: var(--green); }

    .phase-state {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: var(--muted);
    }

    /* Phase-state colour variants (toggled via JS class) */
    .phase-state--green  { color: var(--green);  }
    .phase-state--yellow { color: var(--yellow); }
    .phase-state--red    { color: var(--red);    }

    .phase-timer {
      font-size: 28px;
      font-weight: 800;
      font-family: 'Space Mono', monospace;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .phase-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .btn-override {
      width: 100%;
      padding: 9px 0;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--blue);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      z-index: 1;
    }

    .btn-override:hover {
      background: var(--blue-dim);
      border-color: var(--blue);
      box-shadow: 0 0 12px rgba(77,159,255,0.2);
    }

    /* ─── Chart ─── */
    canvas { max-height: 240px; }

    /* ─── Alerts ─── */
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity:0; transform:translateX(-8px); }
      to   { opacity:1; transform:translateX(0); }
    }

    .alert-item.CONGESTION {
      background: var(--yellow-dim);
      border: 1px solid rgba(255,201,60,0.2);
    }

    .alert-item.INCIDENT {
      background: var(--red-dim);
      border: 1px solid rgba(255,77,109,0.2);
    }

    .alert-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .alert-item.CONGESTION .alert-dot { background: var(--yellow); }
    .alert-item.INCIDENT   .alert-dot { background: var(--red); }

    /* Alert message sub-text */
    .alert-msg {
      color: var(--muted2);
      font-size: 12px;
    }

    .alert-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 30px 20px;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
    }

    .alert-empty-icon { font-size: 28px; opacity: 0.4; }

    /* ─── Bottom row ─── */
    .bottom-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .stats-row { grid-template-columns: 1fr; }
      .signals-grid { grid-template-columns: repeat(2, 1fr); }
      .main-grid, .bottom-row { grid-template-columns: 1fr; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ─── Colour helpers ─── */
    .col-green  { color: var(--green);  }
    .col-blue   { color: var(--blue);   }
    .col-yellow { color: var(--yellow); }
    .col-red    { color: var(--red);    }
  </style>
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo-icon">🚦</div>
      <div>
        <h1>Smart<span>Traffic</span></h1>
        <div class="subtitle">INTERSECTION CONTROL SYSTEM</div>
      </div>
    </div>
    <div class="header-right">
      <div class="pill">
        <span class="dot" id="dot"></span>
        <span id="ts">Connecting…</span>
      </div>
      <div class="pill">
        API &nbsp;<span id="api-status" class="col-green">LIVE</span>
      </div>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">🚗</div>
      <div class="stat-label">Total Vehicles</div>
      <div class="stat-val col-green" id="stat-total">0</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-icon">🔀</div>
      <div class="stat-label">Active Phase</div>
      <!-- ✅ was: style="font-size:28px;letter-spacing:-1px;" → now a CSS class -->
      <div class="stat-val stat-val--phase col-blue" id="stat-phase">—</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-icon">⚠️</div>
      <div class="stat-label">Open Alerts</div>
      <div class="stat-val col-yellow" id="stat-alerts">0</div>
    </div>
  </div>

  <!-- Signal Cards -->
  <div class="signals-section">
    <div class="signals-header">
      <div class="section-title">Phase Signals</div>
      <div class="card-badge" id="phase-badge">MONITORING</div>
    </div>
    <div class="signals-grid" id="signals-grid"></div>
  </div>

  <!-- Chart + Alerts -->
  <div class="bottom-row">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Vehicle Trend · Last 30 Updates</div>
        <div class="card-badge">LIVE</div>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Active Alerts</div>
        <!-- ✅ was: style="background:…;color:…;display:none;" → now CSS classes -->
        <div id="alerts-count-badge" class="card-badge card-badge--alerts">0</div>
      </div>
      <div id="alerts-list">
        <div class="alert-empty">
          <div class="alert-empty-icon">✅</div>
          No active alerts
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ==================== CONFIG ====================
const API = "http://127.0.0.1:8000";
const WS  = "ws://127.0.0.1:8000/ws";

// ==================== Chart ====================
const ctx = document.getElementById("chart").getContext("2d");
const chart = new Chart(ctx, {
  type: "line",
  data: { labels: [], datasets: [] },
  options: {
    responsive: true,
    animation: false,
    plugins: {
      legend: {
        labels: {
          color: "#5a6e99",
          font: { size: 11, family: "'Space Mono', monospace" },
          boxWidth: 10,
          boxHeight: 10,
          borderRadius: 3,
          useBorderRadius: true
        }
      }
    },
    scales: {
      x: {
        ticks: { color: "#3d5075", font: { size: 10, family: "'Space Mono', monospace" } },
        grid:  { color: "#131b2e" }
      },
      y: {
        ticks: { color: "#3d5075", font: { size: 10, family: "'Space Mono', monospace" } },
        grid:  { color: "#131b2e" },
        beginAtZero: true
      }
    }
  }
});

const colors = { North: "#00f5a0", South: "#b06dff", East: "#4d9fff", West: "#ffc93c" };
const phaseDatasets = {};

// ==================== Build Signal Cards ====================
function buildSignalCards() {
  const grid = document.getElementById("signals-grid");
  grid.innerHTML = "";
  ["North","South","East","West"].forEach(phase => {
    const div = document.createElement("div");
    div.className = "card signal-card";
    div.id = `card-${phase}`;
    div.innerHTML = `
      <div class="signal-dir">${phase}</div>
      <div class="traffic-light">
        <div class="bulb" id="r-${phase}"></div>
        <div class="bulb" id="y-${phase}"></div>
        <div class="bulb" id="g-${phase}"></div>
      </div>
      <div class="phase-state" id="state-${phase}">—</div>
      <div class="phase-timer" id="timer-${phase}">--s</div>
      <div class="phase-count" id="count-${phase}">0 vehicles</div>
      <button class="btn-override" onclick="override('${phase}')">FORCE GREEN</button>
    `;
    grid.appendChild(div);
  });
}

// ==================== Update Functions ====================

// ✅ was: stateEl.style.color = "var(--green)" etc.
// Now: toggle a CSS class instead of an inline style
function setPhaseStateClass(el, state) {
  el.classList.remove("phase-state--green", "phase-state--yellow", "phase-state--red");
  if (state === "GREEN")                         el.classList.add("phase-state--green");
  else if (state === "YELLOW")                   el.classList.add("phase-state--yellow");
  else if (state === "RED" || state === "ALL_RED") el.classList.add("phase-state--red");
}

// ✅ was: dot.style.background = "var(--green)" etc.
// Now: set a data-attribute-driven colour via CSS custom property override
const DOT_COLORS = { green: "var(--green)", yellow: "var(--yellow)", red: "var(--red)" };
function setDotColor(color) {
  document.getElementById("dot").style.setProperty("background", DOT_COLORS[color] ?? DOT_COLORS.green);
}

function updateSignal(phase, state, timeLeft, count) {
  document.getElementById(`r-${phase}`).className = `bulb ${(state==="RED"||state==="ALL_RED") ? "red-on" : ""}`;
  document.getElementById(`y-${phase}`).className = `bulb ${state==="YELLOW" ? "yellow-on" : ""}`;
  document.getElementById(`g-${phase}`).className = `bulb ${state==="GREEN"  ? "green-on" : ""}`;

  const stateEl = document.getElementById(`state-${phase}`);
  stateEl.textContent = state;
  setPhaseStateClass(stateEl, state);

  document.getElementById(`timer-${phase}`).textContent = `${timeLeft}s`;
  document.getElementById(`count-${phase}`).textContent = `${count} vehicles`;
  document.getElementById(`card-${phase}`).classList.toggle("active", state === "GREEN");
}

function pushChartPoint(counts) {
  const label = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  chart.data.labels.push(label);
  if (chart.data.labels.length > 30) chart.data.labels.shift();

  Object.keys(colors).forEach(phase => {
    if (!phaseDatasets[phase]) {
      phaseDatasets[phase] = {
        label: phase,
        data: [],
        borderColor: colors[phase],
        backgroundColor: colors[phase] + "18",
        borderWidth: 2,
        tension: 0.4,
        pointRadius: 0,
        fill: false
      };
      chart.data.datasets.push(phaseDatasets[phase]);
    }
    const val = counts[phase]?.total ?? 0;
    phaseDatasets[phase].data.push(val);
    if (phaseDatasets[phase].data.length > 30) phaseDatasets[phase].data.shift();
  });
  chart.update("none");
}

// ==================== WebSocket ====================
function connectWS() {
  const ws = new WebSocket(WS);

  ws.onopen = () => {
    setDotColor("green");
    const apiStatus = document.getElementById("api-status");
    apiStatus.textContent = "LIVE";
    apiStatus.className = "col-green";
  };

  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type !== "state_update") return;

    document.getElementById("ts").textContent = new Date(d.timestamp + "Z").toLocaleTimeString();

    let total = 0;
    d.phases.forEach(p => {
      const count = d.counts[p.phase]?.total ?? 0;
      total += count;
      updateSignal(p.phase, p.state, p.time_left, count);
    });

    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-phase").textContent  = d.active_phase;
    document.getElementById("phase-badge").textContent = `${d.active_phase} ACTIVE`;
    pushChartPoint(d.counts);
  };

  ws.onclose = () => {
    setDotColor("yellow");
    document.getElementById("ts").textContent = "Reconnecting…";
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    setDotColor("red");
    const apiStatus = document.getElementById("api-status");
    apiStatus.textContent = "OFFLINE";
    apiStatus.className = "col-red";
  };
}

// ==================== Alerts ====================
async function fetchAlerts() {
  try {
    const res  = await fetch(`${API}/alerts`);
    const data = await res.json();
    const count = data.length;

    document.getElementById("stat-alerts").textContent = count;

    // ✅ was: badge.style.display = "inline-block" / "none"
    // Now: toggle a CSS class
    const badge = document.getElementById("alerts-count-badge");
    badge.textContent = count;
    badge.classList.toggle("is-visible", count > 0);

    const list = document.getElementById("alerts-list");
    if (!count) {
      list.innerHTML = `
        <div class="alert-empty">
          <div class="alert-empty-icon">✅</div>
          No active alerts
        </div>`;
      return;
    }

    // ✅ was: style="color:var(--muted2);font-size:12px;" on span → now class="alert-msg"
    list.innerHTML = data.map(a => `
      <div class="alert-item ${a.type}">
        <div class="alert-dot"></div>
        <div>
          <strong>${a.type}</strong><br>
          <span class="alert-msg">${a.message ?? "No details"}</span>
        </div>
      </div>`).join("");
  } catch(e) {}
}

// ==================== Override ====================
async function override(phase) {
  await fetch(`${API}/signal/override/${phase}`, { method: "POST" });
}

// ==================== Init ====================
buildSignalCards();
connectWS();
fetchAlerts();
setInterval(fetchAlerts, 10000);
</script>
